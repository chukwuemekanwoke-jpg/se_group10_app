<!DOCTYPE html>
<html>
<head>
    <title>Bike Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>

<body>
    <div class="layout">
        <div id="sidebar">
          <div class="sidebar-header">
            <div class="brand">
              <div class="brand-badge">DB</div>
              <div class="brand-title">
                <strong>Dublin Bikes</strong>
                <span>Live stations, weather & route finder</span>
              </div>
            </div>

            <button id="refreshBtn" type="button" class="action-btn action-btn-inline">
              Refresh
            </button>
          </div>

          <div class="card">
            <h2>Nearby Station Finder</h2>
            <div class="card-body">
              <button id="locateBtn" type="button" class="action-btn">Use my location</button>

              <label for="radiusSelect">Radius</label>
              <select id="radiusSelect">
                <option value="500">500 m</option>
                <option value="800" selected>800 m</option>
                <option value="1000">1000 m</option>
                <option value="1500">1500 m</option>
              </select>

              <button id="findRouteBtn" type="button" class="action-btn">Find nearest station</button>

              <div id="routeResult" class="route-result">
                No recommendation yet.
              </div>
            </div>
          </div>

          <div class="card">
            <h2>Station</h2>
            <div id="stationDetails" class="card-body">
              <div class="skeleton" style="width: 70%"></div>
              <div class="skeleton" style="width: 90%"></div>
              <div class="skeleton" style="width: 55%"></div>
            </div>
          </div>

          <div class="card">
            <h2>Weather</h2>
            <div id="weatherDetails" class="card-body">
              <div class="skeleton" style="width: 60%"></div>
              <div class="skeleton" style="width: 80%"></div>
              <div class="skeleton" style="width: 50%"></div>
            </div>
          </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="{{ url_for('static', filename='js/map.js') }}"></script>

    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key={{ apikey }}&callback=initMap" async defer></script>
</body>
</html>
